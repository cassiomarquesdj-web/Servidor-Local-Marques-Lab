name: 4K Download — Release macOS assinado e notarizado

on:
  push:
    tags: ["4kdownload-v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publicar um GitHub Release com os DMGs"
        type: boolean
        default: true
      universal:
        description: "Tentar também o binário Universal 2"
        type: boolean
        default: true

permissions:
  contents: write

defaults:
  run:
    working-directory: marqueslab-4k-download

env:
  PYTHON_VERSION: "3.12"

jobs:
  preflight:
    name: Credenciais Apple
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exigir os Secrets de distribuição
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: packaging/check_apple_credentials.sh

  build:
    name: ${{ matrix.label }}
    needs: preflight
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
            label: Apple Silicon (arm64)
          - runner: macos-13
            arch: x86_64
            label: Intel (x86_64)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Pipeline completo (build → assinatura → notarização → DMG → validação)
        env:
          MARQUESLAB_ARCH_TAG: ${{ matrix.arch }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: packaging/release_macos.sh

      - name: Publicar DMG
        uses: actions/upload-artifact@v4
        with:
          name: MarquesLab-4K-Download-${{ matrix.arch }}
          path: marqueslab-4k-download/release/*.dmg
          if-no-files-found: error

  universal:
    name: Universal 2 (arm64 + x86_64)
    needs: preflight
    if: github.event_name != 'workflow_dispatch' || inputs.universal
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python universal2 do python.org
        run: |
          set -euo pipefail
          PKG="python-${PY_UNIVERSAL}-macos11.pkg"
          curl -fsSLO "https://www.python.org/ftp/python/${PY_UNIVERSAL}/${PKG}"
          sudo installer -pkg "$PKG" -target /
          FRAMEWORK="/Library/Frameworks/Python.framework/Versions/${PY_UNIVERSAL%.*}"
          echo "$FRAMEWORK/bin" >> "$GITHUB_PATH"
          lipo -info "$FRAMEWORK/Python" | tee /tmp/pyarch.txt
          grep -q "arm64" /tmp/pyarch.txt && grep -q "x86_64" /tmp/pyarch.txt \
            || { echo "Python instalado não é universal2"; exit 1; }
        env:
          PY_UNIVERSAL: "3.12.10"   # último 3.12 com instalador universal2 no python.org

      - name: Instalar dependências
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-dev.txt

      - name: Montar FFmpeg Universal 2
        run: |
          python3 packaging/make_universal_ffmpeg.py "$PWD/build/ffmpeg-universal"
          echo "MARQUESLAB_FFMPEG=$PWD/build/ffmpeg-universal" >> "$GITHUB_ENV"

      - name: Pipeline completo Universal 2
        env:
          MARQUESLAB_TARGET_ARCH: universal2
          MARQUESLAB_ARCH_TAG: universal2
          PYTHON_BIN: python3
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: packaging/release_macos.sh

      - name: Publicar DMG Universal 2
        uses: actions/upload-artifact@v4
        with:
          name: MarquesLab-4K-Download-universal2
          path: marqueslab-4k-download/release/*.dmg
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: [build, universal]
    if: always() && needs.build.result == 'success' && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixar os DMGs validados
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: MarquesLab-4K-Download-*
          merge-multiple: true

      - name: Listar artefatos
        run: ls -lh ../artifacts

      - name: Montar as notas do release
        run: |
          VERSION="$(python3 -c 'import branding; print(branding.VERSION)')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          {
            echo "# Marques Lab 4K Download $VERSION"
            echo
            echo "Gerenciador de downloads de mídia para macOS. Assinado com Developer ID,"
            echo "notarizado pela Apple e com o ticket anexado ao DMG e ao aplicativo."
            echo
            echo "## Como instalar"
            echo
            echo "1. Baixe o DMG correspondente ao seu Mac."
            echo "2. Abra o DMG."
            echo "3. Arraste **Marques Lab 4K Download** para **Applications**."
            echo "4. Abra o aplicativo normalmente pelo Launchpad ou pelo Finder."
            echo
            echo "Não é necessário Terminal, Python, FFmpeg ou qualquer dependência."
            echo "Não aparece aviso de desenvolvedor não identificado."
            echo
            echo "## Downloads"
            echo
            for dmg in ../artifacts/*.dmg; do
              [ -e "$dmg" ] || continue
              name="$(basename "$dmg")"
              case "$name" in
                *arm64*)     echo "- **macOS Apple Silicon (M1/M2/M3/M4)** — \`$name\`" ;;
                *x86_64*)    echo "- **macOS Intel** — \`$name\`" ;;
                *universal*) echo "- **macOS Universal 2 (Apple Silicon + Intel)** — \`$name\`" ;;
                *)           echo "- \`$name\`" ;;
              esac
            done
            echo
            echo "## Requisitos"
            echo
            echo "- macOS 13 Ventura ou superior."
            echo
            echo "## Validação executada antes da publicação"
            echo
            echo "- \`codesign --verify --deep --strict\` no aplicativo"
            echo "- Hardened Runtime confirmado"
            echo "- Notarização aceita pela Apple (aplicativo e DMG)"
            echo "- \`xcrun stapler validate\` no aplicativo e no DMG"
            echo "- \`spctl --assess --type execute\` aprovado pelo Gatekeeper"
            echo "- Download e conversão MP3 reais executados a partir do DMG montado"
          } > ../RELEASE_NOTES.md
          cat ../RELEASE_NOTES.md

      - name: Publicar o release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            4kdownload-v*) ;;
            *) TAG="4kdownload-v${VERSION}" ;;
          esac
          gh release create "$TAG" ../artifacts/*.dmg \
            --repo "$GITHUB_REPOSITORY" \
            --title "Marques Lab 4K Download $VERSION" \
            --notes-file ../RELEASE_NOTES.md \
            --latest \
            || gh release upload "$TAG" ../artifacts/*.dmg --repo "$GITHUB_REPOSITORY" --clobber
