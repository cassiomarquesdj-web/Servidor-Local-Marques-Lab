name: Marques Lab 4K Download — Diagnóstico

on:
  push:
    branches: ["agent/marqueslab-4k-download", "main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marqueslab-4k-download
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: marqueslab-4k-download/requirements.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Static project diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path
          required = ["README.md", "engine.py", "app.py", "requirements.txt"]
          for item in required:
              assert Path(item).exists(), f"Missing required file: {item}"
          print("PROJECT_STRUCTURE: PASS")
          PY

      - name: Unit tests
        run: pytest -q

      - name: Engine dependency diagnostics
        run: |
          python - <<'PY'
          import importlib.util
          checks = {
              "yt_dlp": importlib.util.find_spec("yt_dlp") is not None,
              "PySide6": importlib.util.find_spec("PySide6") is not None,
              "imageio_ffmpeg": importlib.util.find_spec("imageio_ffmpeg") is not None,
          }
          for name, ok in checks.items():
              print(f"{name}: {'PASS' if ok else 'WARNING'}")
              assert ok, f"Missing dependency: {name}"
          PY

      - name: FFmpeg integration diagnostic
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          out = Path("ci-fixture.mp4")
          subprocess.run([
              "ffmpeg", "-y", "-f", "lavfi", "-i", "testsrc=size=320x240:rate=10",
              "-f", "lavfi", "-i", "sine=frequency=440:sample_rate=44100", "-t", "1",
              "-c:v", "libx264", "-c:a", "aac", str(out)
          ], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          assert out.exists() and out.stat().st_size > 0
          out.unlink()
          print("FFMPEG_PIPELINE: PASS")
          PY

      - name: Generate diagnostic report
        if: always()
        run: |
          {
            echo "# Marques Lab 4K Download — CI Diagnostic"
            echo
            echo "- Commit: $GITHUB_SHA"
            echo "- Runner: $RUNNER_OS"
            echo "- Python: $(python --version 2>&1)"
            echo "- FFmpeg: $(ffmpeg -version | head -n 1)"
            echo "- Real provider download: NOT EXECUTED"
            echo "- Authentication/DRM bypass: NOT SUPPORTED"
          } > DIAGNOSTICO-CI.md

      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marqueslab-diagnostic
          path: marqueslab-4k-download/DIAGNOSTICO-CI.md
