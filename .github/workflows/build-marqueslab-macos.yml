name: Marques Lab 4K Download — macOS Build

on:
  push:
    branches: ["agent/marqueslab-4k-download"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-13
            arch: x86_64
            artifact: MarquesLab-4K-Download-macOS-Intel
          - runner: macos-14
            arch: arm64
            artifact: MarquesLab-4K-Download-macOS-AppleSilicon
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: marqueslab-4k-download
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller imageio-ffmpeg

      - name: Locate bundled FFmpeg
        id: ffmpeg
        run: |
          FF="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          echo "path=$FF" >> "$GITHUB_OUTPUT"
          echo "FFmpeg: $FF"
          echo "$(dirname "$FF")" >> "$GITHUB_PATH"
          "$FF" -version | head -n 1

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Build application
        run: |
          rm -rf build dist
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name "Marques Lab 4K Download" \
            --add-binary "${{ steps.ffmpeg.outputs.path }}:ffmpeg" \
            app.py

      - name: Smoke test packaged app
        run: test -d "dist/Marques Lab 4K Download.app"

      - name: Create DMG
        run: |
          mkdir -p dmg-root
          cp -R "dist/Marques Lab 4K Download.app" "dmg-root/"
          ln -s /Applications "dmg-root/Applications"
          hdiutil create \
            -volname "Marques Lab 4K Download" \
            -srcfolder dmg-root \
            -ov \
            -format UDZO \
            "../MarquesLab-4K-Download-${{ matrix.arch }}.dmg"

      - name: Validate DMG
        run: |
          test -f "../MarquesLab-4K-Download-${{ matrix.arch }}.dmg"
          hdiutil imageinfo "../MarquesLab-4K-Download-${{ matrix.arch }}.dmg" >/dev/null

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-DMG
          path: MarquesLab-4K-Download-${{ matrix.arch }}.dmg
