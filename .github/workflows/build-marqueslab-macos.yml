name: Marques Lab 4K Download — macOS Build

on:
  push:
    branches: ["agent/marqueslab-4k-download"]
  workflow_dispatch:

env:
  APP_NAME: Marques Lab 4K Download

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-13
            arch: x86_64
            artifact: MarquesLab-4K-Download-macOS-Intel
          - runner: macos-14
            arch: arm64
            artifact: MarquesLab-4K-Download-macOS-AppleSilicon
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: marqueslab-4k-download
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller imageio-ffmpeg

      - name: Locate bundled FFmpeg
        id: ffmpeg
        run: |
          FF="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          echo "path=$FF" >> "$GITHUB_OUTPUT"
          echo "$(dirname "$FF")" >> "$GITHUB_PATH"
          "$FF" -version | head -n 1

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Build application
        run: |
          rm -rf build dist
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name "$APP_NAME" \
            --add-binary "${{ steps.ffmpeg.outputs.path }}:ffmpeg" \
            app.py

      - name: Sign application
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          APP="dist/$APP_NAME.app"
          if [ -n "$APPLE_CERTIFICATE_BASE64" ]; then
            KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
            CERT="$RUNNER_TEMP/developer_id.p12"
            echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT"
            security create-keychain -p "build" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "build" "$KEYCHAIN"
            security import "$CERT" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
            security list-keychain -d user -s "$KEYCHAIN"
            security find-identity -v -p codesigning "$KEYCHAIN"
            IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
            test -n "$IDENTITY"
            codesign --force --deep --options runtime --timestamp --sign "$IDENTITY" "$APP"
            codesign --verify --deep --strict --verbose=2 "$APP"
          else
            # Fallback for development builds when Developer ID secrets are not configured.
            codesign --force --deep --sign - "$APP"
            codesign --verify --deep --strict --verbose=2 "$APP"
          fi

      - name: Smoke test packaged app
        run: test -d "dist/$APP_NAME.app"

      - name: Create DMG
        run: |
          rm -rf dmg-root
          mkdir -p dmg-root
          cp -R "dist/$APP_NAME.app" "dmg-root/"
          ln -s /Applications "dmg-root/Applications"
          hdiutil create \
            -volname "$APP_NAME" \
            -srcfolder dmg-root \
            -ov \
            -format UDZO \
            "../MarquesLab-4K-Download-${{ matrix.arch }}.dmg"

      - name: Optional notarization
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          DMG="../MarquesLab-4K-Download-${{ matrix.arch }}.dmg"
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
            xcrun notarytool submit "$DMG" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --wait
            xcrun stapler staple "$DMG"
            xcrun stapler validate "$DMG"
            echo "NOTARIZATION: PASS"
          else
            echo "NOTARIZATION: SKIPPED — Developer ID/Apple credentials are not configured"
          fi

      - name: Validate DMG
        run: |
          DMG="../MarquesLab-4K-Download-${{ matrix.arch }}.dmg"
          test -f "$DMG"
          hdiutil imageinfo "$DMG" >/dev/null

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-DMG
          path: MarquesLab-4K-Download-${{ matrix.arch }}.dmg
