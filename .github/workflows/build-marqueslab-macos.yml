name: Marques Lab 4K Download — macOS Build

on:
  push:
    branches: ["agent/marqueslab-4k-download"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-13
            arch: x86_64
            artifact: MarquesLab-4K-Download-macOS-Intel
          - runner: macos-14
            arch: arm64
            artifact: MarquesLab-4K-Download-macOS-AppleSilicon
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: marqueslab-4k-download
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Locate bundled FFmpeg
        id: ffmpeg
        run: echo "path=$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" >> "$GITHUB_OUTPUT"

      - name: Build application
        run: |
          rm -rf build dist
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name "Marques Lab 4K Download" \
            --add-binary "${{ steps.ffmpeg.outputs.path }}:ffmpeg" \
            app.py

      - name: Smoke test packaged app
        run: test -d "dist/Marques Lab 4K Download.app"

      - name: Package ZIP
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/Marques Lab 4K Download.app" "../MarquesLab-4K-Download-${{ matrix.arch }}.zip"

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: MarquesLab-4K-Download-${{ matrix.arch }}.zip
