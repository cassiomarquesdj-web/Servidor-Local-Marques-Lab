name: 4K Download — CI

on:
  push:
    branches: ["main", "feat/**", "agent/**"]
    paths:
      - "marqueslab-4k-download/**"
      - ".github/workflows/marqueslab-4k-download-*.yml"
  pull_request:
    paths:
      - "marqueslab-4k-download/**"
      - ".github/workflows/marqueslab-4k-download-*.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: marqueslab-4k-download

jobs:
  tests:
    name: Testes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: marqueslab-4k-download/requirements-dev.txt

      - name: Bibliotecas de sistema do Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libdbus-1-3 libfontconfig1 \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Diagnóstico de dependências
        run: |
          python - <<'PY'
          import importlib.util
          import sys
          required = ["yt_dlp", "PySide6", "imageio_ffmpeg", "PyInstaller"]
          missing = [name for name in required if importlib.util.find_spec(name) is None]
          for name in required:
              print(f"{name}: {'PASS' if name not in missing else 'FAIL'}")
          sys.exit(1 if missing else 0)
          PY

      - name: FFmpeg embarcado disponível
        run: |
          python - <<'PY'
          import subprocess
          from engine import ffmpeg_executable
          binary = ffmpeg_executable()
          assert binary, "FFmpeg não resolvido"
          print(subprocess.run([binary, "-version"], capture_output=True, text=True).stdout.splitlines()[0])
          PY

      - name: Suíte de testes (inclui download real via servidor local)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q --tb=short

  package:
    name: Empacotamento macOS (sem assinatura)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Construir o .app
        run: packaging/build_app.sh

      - name: Download real dentro do aplicativo empacotado
        run: |
          APP="dist/Marques Lab 4K Download.app/Contents/MacOS/Marques Lab 4K Download"
          "$APP" --self-test-download

      - name: Gerar DMG de verificação
        run: packaging/make_dmg.sh

      - name: Relatório
        if: always()
        run: |
          {
            echo "# Marques Lab 4K Download — CI"
            echo
            echo "- Commit: $GITHUB_SHA"
            echo "- Runner: $RUNNER_OS $(uname -m)"
            echo "- Python: $(python --version 2>&1)"
            echo "- Este job NÃO assina nem notariza: é validação de engenharia."
            echo "- Releases públicos saem apenas do workflow de release, assinados e notarizados."
          } > DIAGNOSTICO-CI.md
          cat DIAGNOSTICO-CI.md

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marqueslab-4k-download-ci-report
          path: marqueslab-4k-download/DIAGNOSTICO-CI.md
